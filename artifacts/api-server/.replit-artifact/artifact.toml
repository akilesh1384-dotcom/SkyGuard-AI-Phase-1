kind = "api"
previewPath = "/api" # TODO - should be excluded from preview in the first place
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api", "/ws"]

[services.development]
run = "pnpm --filter @workspace/api-server run dev"

[services.production]

[services.production.build]
args = ["bash", "scripts/build-production.sh"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
args = ["bash", "scripts/start-production.sh"]

[services.production.run.env]
PORT = "8080"
NODE_ENV = "production"
ML_SERVICE_URL = "http://127.0.0.1:8001"
SKYGUARD_API_URL = "http://127.0.0.1:8080/api"

[services.production.health.startup]
path = "/api/healthz"
