openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
paths:
  /healthz:
    get:
      operationId: healthCheck
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
  /latest:
    get:
      operationId: getLatestReading
      responses:
        "200":
          content:
            application/json:
              schema: { type: ["object", "null"], $ref: "#/components/schemas/SensorReading" }
  /history:
    get:
      operationId: getReadingHistory
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 240, default: 60 }
      responses:
        "200":
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/SensorReading" } }
  /ml/readings:
    get:
      operationId: getMlReadings
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 10000 }
      responses:
        "200":
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/MlReading" } }
  /ml/ground-truth:
    get:
      operationId: getMlGroundTruth
      responses:
        "200":
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/GroundTruthEvent" } }
  /status:
    get:
      operationId: getSimulatorStatus
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/SimulatorStatus" } } } }
  /simulator/start:
    post:
      operationId: startSimulator
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/SimulatorStatus" } } } }
  /simulator/stop:
    post:
      operationId: stopSimulator
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/SimulatorStatus" } } } }
  /simulator/reset:
    post:
      operationId: resetSimulator
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/SimulatorStatus" } } } }
  /simulator/mode:
    post:
      operationId: setSimulatorMode
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SimulatorModeInput" }
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/SimulatorStatus" } } } }
components:
  schemas:
    HealthStatus:
      type: object
      properties: { status: { type: string } }
      required: [status]
    SensorReading:
      type: object
      properties:
        id: { type: integer }
        timestamp: { type: string, format: date-time }
        temperature: { type: number }
        humidity: { type: number }
        pressure: { type: ["number", "null"], description: "Unavailable on the physical AWS prototype." }
      required: [id, timestamp, temperature, humidity, pressure]
    MlReading:
      type: object
      properties:
        timestamp: { type: string, format: date-time }
        temperature: { type: number }
        humidity: { type: number }
        pressure: { type: ["number", "null"], description: "Unavailable on the physical AWS prototype." }
      required: [timestamp, temperature, humidity, pressure]
    GroundTruthEvent:
      type: object
      properties:
        fault_type: { type: string }
        affected_variable: { type: string }
        start_timestamp: { type: string, format: date-time }
        end_timestamp: { type: ["string", "null"], format: date-time }
      required: [fault_type, affected_variable, start_timestamp, end_timestamp]
    SimulatorMode:
      type: string
      enum: [NORMAL, TEMPERATURE_SPIKE, TEMPERATURE_DROP, HUMIDITY_SPIKE, PRESSURE_ANOMALY, FROZEN_SENSOR, GRADUAL_DRIFT, MISSING_DATA, MULTIVARIATE_INCONSISTENCY]
    SimulatorModeInput:
      type: object
      properties: { mode: { $ref: "#/components/schemas/SimulatorMode" } }
      required: [mode]
    SimulatorStatus:
      type: object
      properties:
        status: { type: string, enum: [NORMAL, SIMULATING, STOPPED, ERROR] }
        mode: { $ref: "#/components/schemas/SimulatorMode" }
        connectedClients: { type: integer, minimum: 0 }
        lastReadingAt: { type: ["string", "null"], format: date-time }
        readingsStored: { type: integer, minimum: 0 }
      required: [status, mode, connectedClients, lastReadingAt, readingsStored]
    ErrorResponse:
      type: object
      properties: { error: { type: string } }
      required: [error]
